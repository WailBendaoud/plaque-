<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Parking 3D Correct</title>
  <style>
    body { margin:0; overflow:hidden; }
    canvas { display:block; }
  </style>
</head>
<body>
<!-- Charger Three.js -->
<script src="https://unpkg.com/three@0.161.0/build/three.min.js"></script>
<!-- Charger OrbitControls -->
<script src="https://unpkg.com/three@0.161.0/examples/js/controls/OrbitControls.js"></script>
<script>
  // Ici commence ton code Three.js
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xa0a0a0);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(0,200,400);

  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0,0,0);
  controls.update();

  const light = new THREE.DirectionalLight(0xffffff,1);
  light.position.set(100,200,100);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0x404040));

  const planeGeometry = new THREE.PlaneGeometry(500,500);
  const planeMaterial = new THREE.MeshPhongMaterial({color:0x808080});
  const plane = new THREE.Mesh(planeGeometry, planeMaterial);
  plane.rotation.x = -Math.PI/2;
  scene.add(plane);

  // Exemple simple : une place et une voiture
  const placeGeometry = new THREE.BoxGeometry(20,1,40);
  const placeMaterial = new THREE.MeshPhongMaterial({color:0x00ff00});
  const place = new THREE.Mesh(placeGeometry, placeMaterial);
  place.position.set(0,0.5,0);
  scene.add(place);

  const carGeometry = new THREE.BoxGeometry(15,5,30);
  const carMaterial = new THREE.MeshPhongMaterial({color:0xff0000});
  const car = new THREE.Mesh(carGeometry, carMaterial);
  car.position.set(-100,2.5,0);
  scene.add(car);

  // Animation simple
  function animate(){
    requestAnimationFrame(animate);
    car.position.lerp(new THREE.Vector3(0,2.5,0),0.02);
    renderer.render(scene,camera);
  }

  animate();

  window.addEventListener('resize',()=>{
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
